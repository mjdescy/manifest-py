[project]
name = "manifest-py"
version = "0.1.0"
description = "Directory manifest creator"
readme = "README.md"
authors = [
    { name = "Michael Descy", email = "mike@mjdescy.me" }
]
requires-python = ">=3.15"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
manifest-py = "manifest_py.cli:app"
    
[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
